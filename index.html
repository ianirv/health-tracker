<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1976d2">
  <link rel="manifest" href="./manifest.json">
  <title>My Health Tracker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 16px;
      background: #f4f6f8;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 5px;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      font-size: 18px;
      border: 0;
      border-radius: 8px;
      background: #1976d2;
      color: white;
    }

    .reading {
      background: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .date {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>My Health Tracker</h1>

  <div class="card">

    <label for="systolic">Systolic blood pressure</label>
    <input id="systolic" type="number" inputmode="numeric"
           placeholder="e.g. 125">

    <label for="diastolic">Diastolic blood pressure</label>
    <input id="diastolic" type="number" inputmode="numeric"
           placeholder="e.g. 65">

    <label for="pulse">Pulse / heartbeat</label>
    <input id="pulse" type="number" inputmode="numeric"
           placeholder="e.g. 72">

    <label for="glucose">Blood sugar (mg/dL)</label>
    <input id="glucose" type="number" inputmode="decimal"
           placeholder="Optional">

    <button type="button" onclick="saveReading()">Save Reading</button>

  </div>

  <div class="card">
  <h2>Backup & Restore</h2>

  <button type="button" onclick="backupReadings()">
    Backup Readings
  </button>

  <button type="button" onclick="document.getElementById('restoreFile').click()">
    Restore Readings
  </button>

  <input id="restoreFile"
         type="file"
         accept=".json,application/json"
         onchange="restoreReadings(event)"
         style="display:none">
  </div>
  <h2>Previous Readings</h2>
  <div id="history"></div>

  <script>
    function getReadings() {
      try {
        return JSON.parse(localStorage.getItem("healthReadings") || "[]");
      } catch {
        return [];
      }
    }

    function saveReading() {
      const systolic = document.getElementById("systolic").value;
      const diastolic = document.getElementById("diastolic").value;
      const pulse = document.getElementById("pulse").value;
      const glucose = document.getElementById("glucose").value;

      if (!systolic || !diastolic || !pulse) {
        alert("Please enter blood pressure and pulse.");
        return;
      }

      const readings = getReadings();

      readings.unshift({
        date: new Date().toLocaleString(),
        systolic: systolic,
        diastolic: diastolic,
        pulse: pulse,
        glucose: glucose
      });

      localStorage.setItem("healthReadings", JSON.stringify(readings));

      document.getElementById("systolic").value = "";
      document.getElementById("diastolic").value = "";
      document.getElementById("pulse").value = "";
      document.getElementById("glucose").value = "";

     displayReadings();
    }
      function backupReadings() {
  const readings = getReadings();

  if (readings.length === 0) {
    alert("There are no readings to back up.");
    return;
  }

  const backup = {
    app: "My Health Tracker",
    created: new Date().toISOString(),
    readings: readings
  };

  const data = JSON.stringify(backup, null, 2);
const file = new File(
  [data],
  "health-tracker-backup.json",
  { type: "application/json" }
);

if (navigator.share && navigator.canShare &&
    navigator.canShare({ files: [file] })) {
  navigator.share({
    title: "Health Tracker Backup",
    files: [file]
  });
} else {
  const url = URL.createObjectURL(file);
  const link = document.createElement("a");
  link.href = url;
  link.download = "health-tracker-backup.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
setTimeout(() => URL.revokeObjectURL(url), 1000);
}
}

function restoreReadings(event) {
  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      const backup = JSON.parse(e.target.result);

      if (!backup.readings || !Array.isArray(backup.readings)) {
        throw new Error("Invalid backup");
      }

      if (!confirm("Restore this backup? This will replace the readings currently stored in the app.")) {
        return;
      }

      localStorage.setItem(
        "healthReadings",
        JSON.stringify(backup.readings)
      );

      displayReadings();
      alert("Readings restored successfully.");

    } catch (error) {
      alert("This does not appear to be a valid Health Tracker backup.");
    }

    event.target.value = "";
  };

  reader.readAsText(file);
}
      displayReadings();
    }

    function displayReadings() {
      const readings = getReadings();
      const history = document.getElementById("history");

      if (readings.length === 0) {
        history.innerHTML = "<p>No readings recorded yet.</p>";
        return;
      }

      history.innerHTML = readings.map(function(r) {
        return `
          <div class="reading">
            <div class="date">${r.date}</div>
            Blood pressure: ${r.systolic}/${r.diastolic} mmHg<br>
            Pulse: ${r.pulse} bpm
            ${r.glucose ? `<br>Blood sugar: ${r.glucose} mg/dL` : ""}
          </div>
        `;
      }).join("");
    }
    displayReadings();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(function(error) {
            console.log("Service worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
