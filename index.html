<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1976d2">
  <link rel="manifest" href="./manifest.json">
  <title>My Health Tracker</title>

  <style>
    canvas {
    max-width: 100%;
    height: auto;
}
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 16px;
      background: #f4f6f8;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 5px;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      font-size: 18px;
      border: 0;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    .reading {
      background: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .date {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>My Health Tracker</h1>

  <div class="card">
    <label for="systolic">Systolic blood pressure</label>
    <input id="systolic" type="number" inputmode="numeric"
           placeholder="e.g. 125">

    <label for="diastolic">Diastolic blood pressure</label>
    <input id="diastolic" type="number" inputmode="numeric"
           placeholder="e.g. 65">

    <label for="pulse">Pulse / heartbeat</label>
    <input id="pulse" type="number" inputmode="numeric"
           placeholder="e.g. 72">

    <label for="glucose">Blood sugar (mg/dL)</label>
    <input id="glucose" type="number" inputmode="decimal"
           placeholder="Optional">
    <label for="glucoseTiming">Blood sugar timing</label>
<select id="glucoseTiming">
  <option value="">Not specified</option>
  <option value="Fasting">Fasting</option>
  <option value="Before meal">Before meal</option>
  <option value="1 hour after meal">1 hour after meal</option>
  <option value="2 hours after meal">2 hours after meal</option>
  <option value="Bedtime">Bedtime</option>
</select>
<label for="notes">Notes (optional)</label>
<input id="notes" type="text"
       placeholder="e.g. Before breakfast, after exercise">

    <button type="button" id="saveButton">Save Reading</button>
  </div>

  <div class="card">
    <h2>Backup &amp; Restore</h2>

    <button type="button" id="backupButton">Backup Readings</button>

    <button type="button" id="restoreButton">Restore Readings</button>
   
    <button type="button" id="deleteAllButton">Delete All Readings</button>

    <button type="button" id="exportCsvButton">Export to CSV</button>

    <input
      id="restoreFile"
      type="file"
      accept=".json,application/json"
      style="display:none">
  </div>

  <div class="card">
  <h2>Trends</h2>

  <h3>Last 7 Days</h3>
  <div id="trends7">Not enough data yet.</div>
  <h3>Last 30 Days</h3>
  <div id="trends30">Not enough data yet.</div>
    <h3>Last 90 Days</h3>
<div id="trends90">Not enough data yet.</div>
    <h3>Blood Pressure Trend</h3>
<canvas id="bpChart" width="600" height="300"></canvas>
   <h3>Pulse Trend</h3>
<canvas id="pulseChart" width="600" height="300"></canvas>
    <h3>Blood Glucose Trend</h3>
<canvas id="glucoseChart" width="600" height="300"></canvas>
</div>

  <div class="card">
  <h2>Health Report</h2>

  <label for="reportPeriod">Report period:</label>
  <select id="reportPeriod">
    <option value="7">Last 7 Days</option>
    <option value="30">Last 30 Days</option>
    <option value="90">Last 90 Days</option>
  </select>

  <button type="button" id="generateReportButton">
    Generate Report
  </button>
<button type="button" id="printReportButton">
  Print / Save PDF
</button>
  <div id="healthReport"></div>
</div>
  
  <h2>Previous Readings</h2>
  <div id="history"></div>

  <script>
    function getReadings() {
      try {
        return JSON.parse(
          localStorage.getItem("healthReadings") || "[]"
        );
      } catch (error) {
        return [];
      }
    }

    function displayReadings() {
      const readings = getReadings();
      const history = document.getElementById("history");

      if (readings.length === 0) {
        history.innerHTML = "<p>No readings recorded yet.</p>";
        return;
      }

      history.innerHTML = readings.map(function(reading, index) {
        let glucoseText = "";
        let notesText = "";

       if (reading.glucose) {
    glucoseText =
        "<br>Blood sugar: " +
        reading.glucose +
        " mg/dL";

    if (reading.glucoseTiming) {
        glucoseText +=
            " (" + reading.glucoseTiming + ")";
    }
          if (reading.notes) {
    notesText =
        "<br><b>Notes:</b> " +
        reading.notes;
}
let bpText = "";

if (reading.systolic && reading.diastolic && reading.pulse) {
    bpText =
        "Blood pressure: " +
        reading.systolic + "/" +
        reading.diastolic + " mmHg<br>" +
        "Pulse: " + reading.pulse + " bpm";
}       
        return (
       '<div class="reading">' +
'<div class="date">' + reading.date + '</div>' +
bpText +
glucoseText +
notesText +
'<br><button type="button" onclick="deleteReading(' + index + ')">Delete</button>' +
'</div>'
        );
      }).join("");
      displayTrends();
    drawBPChart();
      drawPulseChart();
      drawGlucoseChart();
    }
function printHealthReport() {
    const report = document.getElementById("healthReport");

    if (!report || report.innerHTML.trim() === "") {
        alert("Please generate a report first.");
        return;
    }

    const printWindow = window.open("", "_blank");

    printWindow.document.write(`
        <html>
        <head>
            <title>Health Report</title>
            <style>
   @page {
    size: A4;
    margin: 15mm;
}      
            body {
                    font-family: Arial, sans-serif;
                    margin: 40px;
                    line-height: 1.4;
                }

                h1 {
                    margin-bottom: 20px;
                }

                h3 {
                    margin-top: 24px;
                }

                p {
                    margin-bottom: 16px;
                }
            </style>
            
        </head>
        <body>
            <h1>Health Report</h1>
            ${report.innerHTML}
        </body>
        </html>
    `);

    printWindow.document.close();
    printWindow.focus();
    printWindow.print();
}
    
    function generateHealthReport() {
    const readings = getReadings();
    const days = Number(document.getElementById("reportPeriod").value);
    const report = document.getElementById("healthReport");
    const now = new Date();

    const cutoff = new Date();
    cutoff.setDate(now.getDate() - days);
      cutoff.setHours(0, 0, 0, 0);

    const selectedReadings = readings.filter(function(reading) {
      const dateParts = reading.date.split("/");
let readingDate;

if (dateParts.length === 3) {
    readingDate = new Date(
        Number(dateParts[2]),
        Number(dateParts[1]) - 1,
        Number(dateParts[0])
    );
} else {
    readingDate = new Date(reading.date);
}  

        return !isNaN(readingDate) && readingDate >= cutoff;
    });

    if (selectedReadings.length === 0) {
        report.innerHTML =
            "<p>No readings found for the selected period.</p>";
        return;
    }

    function average(field) {
        const values = selectedReadings
            .map(function(reading) {
                return Number(reading[field]);
            })
            .filter(function(value) {
                return !isNaN(value) && value > 0;
            });

        if (values.length === 0) {
            return "—";
        }

        const total = values.reduce(function(sum, value) {
            return sum + value;
        }, 0);

        return Math.round(total / values.length);
    }

    let html =
        "<h3>Last " + days + " Days</h3>" +
      
        "<p><b>Number of readings:</b> " +
        selectedReadings.length + "</p>" +
   "<p><b>Report generated:</b> " +
new Date().toLocaleDateString("en-GB") + "</p>" +

"<p><b>Average blood pressure:</b> " +
        average("systolic") + "/" +
        average("diastolic") + " mmHg<br>" +

        "<b>Average pulse:</b> " +
        average("pulse") + " bpm<br>" +

        "<b>Average blood glucose:</b> " +
        average("glucose") + " mg/dL</p>" +

        "<h3>Readings</h3>";

  html +=
    "<table style='width:100%; border-collapse:collapse;'>" +
    "<tr>" +
    "<th style='border:1px solid #ccc; padding:6px;'>Date</th>" +
    "<th style='border:1px solid #ccc; padding:6px;'>Time</th>" +
    "<th style='border:1px solid #ccc; padding:6px;'>BP</th>" +
    "<th style='border:1px solid #ccc; padding:6px;'>Pulse</th>" +
    "<th style='border:1px solid #ccc; padding:6px;'>Glucose</th>"
    "<th style='border:1px solid #ccc; padding:6px;'>Timing</th>" +
       "<th style='border:1px solid #ccc; padding:6px;'>Notes</th>" +
    "</tr>";

selectedReadings
    .slice()
    .reverse()
    .forEach(function(reading) {
        html +=
            "<tr>" +
            "<td style='border:1px solid #ccc; padding:6px;'>" +
            (reading.date || "") + "</td>" +
            "<td style='border:1px solid #ccc; padding:6px;'>" +
            (reading.time || "") + "</td>" +
            "<td style='border:1px solid #ccc; padding:6px;'>" +
            reading.systolic + "/" + reading.diastolic + "</td>" +
            "<td style='border:1px solid #ccc; padding:6px;'>" +
            reading.pulse + "</td>" +
            "<td style='border:1px solid #ccc; padding:6px;'>" +
            (reading.glucose || "—") + "</td>" +
          "<td style='border:1px solid #ccc; padding:6px;'>" +
(reading.glucoseTiming || "—") + "</td>" +
          "<td style='border:1px solid #ccc; padding:6px;'>" +
(reading.notes || "—") + "</td>" +
            "</tr>";
    });

html += "</table>";

    report.innerHTML = html;
} 
    function displayTrends() {
    const readings = getReadings();
    const now = new Date();

    function calculateAverage(days) {
        const cutoff = new Date();
        cutoff.setDate(now.getDate() - days);

        const recent = readings.filter(function(reading) {
            const readingDate = new Date(
                reading.time
                    ? reading.date + " " + reading.time
                    : reading.date
            );

            return !isNaN(readingDate) && readingDate >= cutoff;
        });

        if (recent.length === 0) {
            return "Not enough data yet.";
        }

        function average(field) {
            const values = recent
                .map(function(reading) {
                    return Number(reading[field]);
                })
                .filter(function(value) {
                    return !isNaN(value) && value > 0;
                });

            if (values.length === 0) return "—";

            const total = values.reduce(function(sum, value) {
                return sum + value;
            }, 0);

            return Math.round(total / values.length);
        }

        return (
            "<b>Readings:</b> " + recent.length + "<br>" +
            "<b>Blood pressure:</b> " +
            average("systolic") + "/" +
            average("diastolic") + " mmHg<br>" +
            "<b>Pulse:</b> " +
            average("pulse") + " bpm<br>" +
            "<b>Blood glucose:</b> " +
            average("glucose") + " mg/dL"
        );
    }

    document.getElementById("trends7").innerHTML =
        calculateAverage(7);

    document.getElementById("trends30").innerHTML =
        calculateAverage(30);
  document.getElementById("trends90").innerHTML =
    calculateAverage(90);
}
function drawBPChart() {
  const readings = getReadings()
    .filter(function(reading) {
        return reading.systolic &&
               reading.diastolic;
    })
    .slice()
    .reverse();
    const canvas = document.getElementById("bpChart");

    if (!canvas || readings.length === 0) {
        return;
    }

    const ctx = canvas.getContext("2d");

    const width = canvas.width;
    const height = canvas.height;
    const padding = 45;

    ctx.clearRect(0, 0, width, height);

    const systolic = readings.map(function(r) {
        return Number(r.systolic);
    });

    const diastolic = readings.map(function(r) {
        return Number(r.diastolic);
    });

    const allValues = systolic.concat(diastolic);
    const minValue = Math.min.apply(null, allValues) - 10;
    const maxValue = Math.max.apply(null, allValues) + 10;

    function getX(index) {
        if (readings.length === 1) {
            return width / 2;
        }

        return padding +
            index * (width - padding * 2) / (readings.length - 1);
    }

    function getY(value) {
        return height - padding -
            ((value - minValue) / (maxValue - minValue)) *
            (height - padding * 2);
    }

    // Axes
    ctx.beginPath();
    ctx.moveTo(padding, padding);
    ctx.lineTo(padding, height - padding);
    ctx.lineTo(width - padding, height - padding);
    ctx.stroke();
// Y-axis blood pressure labels
ctx.font = "12px Arial";
ctx.textAlign = "right";

const labelSteps = 4;

for (let i = 0; i <= labelSteps; i++) {
    const value =
        minValue + ((maxValue - minValue) * i / labelSteps);

    const y = getY(value);

    ctx.fillText(
        Math.round(value),
        padding - 8,
        y + 4
    );
}

ctx.textAlign = "left";
  
    // Systolic line
  ctx.strokeStyle = "red";
ctx.fillStyle = "red";  
  ctx.beginPath();

    systolic.forEach(function(value, index) {
        const x = getX(index);
        const y = getY(value);

        if (index === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }

        ctx.fillRect(x - 2, y - 2, 4, 4);
    });

    ctx.stroke();

    // Diastolic line
  ctx.strokeStyle = "blue";
ctx.fillStyle = "blue";  
  ctx.beginPath();

    diastolic.forEach(function(value, index) {
        const x = getX(index);
        const y = getY(value);

        if (index === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }

        ctx.strokeRect(x - 2, y - 2, 4, 4);
    });

    ctx.stroke();

    // Labels
   ctx.font = "14px Arial";

ctx.fillStyle = "red";
ctx.fillText("Systolic", padding, 20);

ctx.fillStyle = "blue";
ctx.fillText("Diastolic", padding + 90, 20);

ctx.fillStyle = "black";
ctx.strokeStyle = "black";
  
// Date labels along bottom
ctx.font = "10px Arial";
ctx.textAlign = "center";

readings.forEach(function(reading, index) {
    const x = getX(index);

    let dateLabel = reading.date || "";
    let timeLabel = reading.time || "";

    // Older readings stored date and time together
    if (!timeLabel && dateLabel.includes(",")) {
        const parts = dateLabel.split(",");
        dateLabel = parts[0].trim();
        timeLabel = parts.slice(1).join(",").trim();
    }

    ctx.fillText(
        dateLabel,
        x,
        height - padding + 16
    );

    if (timeLabel) {
        ctx.fillText(
            timeLabel,
            x,
            height - padding + 30
        );
    }
});

ctx.textAlign = "left";
}
function drawPulseChart() {
    const readings = getReadings().slice().reverse();
    const canvas = document.getElementById("pulseChart");

    if (!canvas) {
        return;
    }

    const pulseReadings = readings.filter(function(reading) {
        return reading.pulse && !isNaN(Number(reading.pulse));
    });

    if (pulseReadings.length === 0) {
        return;
    }

    const ctx = canvas.getContext("2d");
    const width = canvas.width;
    const height = canvas.height;
    const padding = 50;

    ctx.clearRect(0, 0, width, height);

    const values = pulseReadings.map(function(reading) {
        return Number(reading.pulse);
    });

    const minValue = Math.max(0, Math.min.apply(null, values) - 10);
    const maxValue = Math.max.apply(null, values) + 10;

    function getX(index) {
        if (pulseReadings.length === 1) {
            return width / 2;
        }

        return padding +
            index * (width - padding * 2) /
            (pulseReadings.length - 1);
    }

    function getY(value) {
        return height - padding -
            ((value - minValue) / (maxValue - minValue)) *
            (height - padding * 2);
    }

    // Axes
    ctx.strokeStyle = "black";
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.moveTo(padding, padding);
    ctx.lineTo(padding, height - padding);
    ctx.lineTo(width - padding, height - padding);
    ctx.stroke();

    // Pulse scale
    ctx.font = "12px Arial";
    ctx.textAlign = "right";

    const labelSteps = 4;

    for (let i = 0; i <= labelSteps; i++) {
        const value =
            minValue + ((maxValue - minValue) * i / labelSteps);

        const y = getY(value);

        ctx.fillText(
            Math.round(value),
            padding - 8,
            y + 4
        );
    }

    // Pulse line
    ctx.strokeStyle = "purple";
    ctx.fillStyle = "purple";
    ctx.beginPath();

    pulseReadings.forEach(function(reading, index) {
        const value = Number(reading.pulse);
        const x = getX(index);
        const y = getY(value);

        if (index === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }

        ctx.fillRect(x - 2, y - 2, 4, 4);
    });

    ctx.stroke();

    // Date and time labels
    ctx.fillStyle = "black";
    ctx.font = "10px Arial";
    ctx.textAlign = "center";

    pulseReadings.forEach(function(reading, index) {
        const x = getX(index);

        let dateLabel = reading.date || "";
        let timeLabel = reading.time || "";

        if (!timeLabel && dateLabel.includes(",")) {
            const parts = dateLabel.split(",");
            dateLabel = parts[0].trim();
            timeLabel = parts.slice(1).join(",").trim();
        }

        ctx.fillText(dateLabel, x, height - padding + 16);

        if (timeLabel) {
            ctx.fillText(timeLabel, x, height - padding + 30);
        }
    });

    ctx.textAlign = "left";
    ctx.fillStyle = "purple";
    ctx.font = "14px Arial";
    ctx.fillText("Pulse (bpm)", padding, 20);

    ctx.fillStyle = "black";
    ctx.strokeStyle = "black";
}

    function deleteReading(index) {
    const readings = getReadings();

    if (!confirm("Delete this reading?")) {
        return;
    }

    readings.splice(index, 1);
    localStorage.setItem("healthReadings", JSON.stringify(readings));
    displayReadings();
}
function deleteAllReadings() {
    const readings = getReadings();

    if (readings.length === 0) {
        alert("There are no readings to delete.");
        return;
    }

    if (!confirm("Delete ALL readings? This cannot be undone.")) {
        return;
    }

    localStorage.removeItem("healthReadings");
    displayReadings();
} 

 function exportToCSV() {
    const readings = getReadings();

    if (readings.length === 0) {
        alert("There are no readings to export.");
        return;
    }

    const rows = [
        ["Date", "Time", "Systolic", "Diastolic", "Pulse", "Blood Glucose"]
    ];

    readings.forEach(function(reading) {
    let date = reading.date || "";
    let time = reading.time || "";

    // Older readings stored date and time together.
    if (!time && date.includes(",")) {
        const parts = date.split(",");
        date = parts[0].trim();
        time = parts.slice(1).join(";").trim();
    }

    rows.push([
        date,
        time,
        reading.systolic || "",
        reading.diastolic || "",
        reading.pulse || "",
        reading.glucose || ""
    ]);
});

    const csv = rows.map(function(row) {
        return row.map(function(value) {
            return '"' + String(value).replace(/"/g, '""') + '"';
        }).join(";");
    }).join("\n");

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "health-readings.csv";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 1000);
}   
    
    function saveReading() {
      const systolic =
        document.getElementById("systolic").value.trim();

      const diastolic =
        document.getElementById("diastolic").value.trim();

      const pulse =
        document.getElementById("pulse").value.trim();

      const glucose =  
        document.getElementById("glucose").value.trim();
      const glucoseTiming =
    document.getElementById("glucoseTiming").value;
      const notes = document.getElementById("notes").value.trim();

 async function backupReadings() {
    const readings = getReadings();

    if (readings.length === 0) {
        alert("There are no readings to back up.");
        return;
    }

    const backup = {
        app: "My Health Tracker",
        created: new Date().toISOString(),
        readings: readings
    };

    const data = JSON.stringify(backup, null, 2);

    const file = new File(
        [data],
        "health-tracker-backup.json",
        { type: "application/json" }
    );

    // On phones/tablets, open the Share menu so Drive can be selected.
    if (navigator.share) {
        try {
            await navigator.share({
                title: "Health Tracker Backup",
                files: [file]
            });
            return;
        } catch (error) {
            // If Share is cancelled, don't download another copy.
            if (error.name === "AbortError") return;
        }
    }

    // Fallback: normal download
    const url = URL.createObjectURL(file);
    const link = document.createElement("a");
    link.href = url;
    link.download = "health-tracker-backup.json";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 1000);
}

    function restoreReadings(file) {
      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = function(event) {
        try {
          const backup = JSON.parse(event.target.result);

          if (
            !backup.readings ||
            !Array.isArray(backup.readings)
          ) {
            throw new Error("Invalid backup");
          }

          const confirmed = confirm(
            "Restore this backup? This will replace " +
            "the readings currently stored in the app."
          );

          if (!confirmed) {
            return;
          }

          localStorage.setItem(
            "healthReadings",
            JSON.stringify(backup.readings)
          );

          displayReadings();
          alert("Readings restored successfully.");

        } catch (error) {
          alert(
            "This does not appear to be a valid " +
            "Health Tracker backup."
          );
        }
      };

      reader.readAsText(file);
    }

    document
      .getElementById("saveButton")
      .addEventListener("click", saveReading);

    document
      .getElementById("backupButton")
      .addEventListener("click", backupReadings);

    document
      .getElementById("restoreButton")
      .addEventListener("click", function() {
        document.getElementById("restoreFile").click();
      });
document
  .getElementById("deleteAllButton")
  .addEventListener("click", deleteAllReadings);
document
  .getElementById("exportCsvButton")
  .addEventListener("click", exportToCSV);

document
  .getElementById("generateReportButton")
  .addEventListener("click", generateHealthReport);
document
  .getElementById("printReportButton")
  .addEventListener("click", printHealthReport);
    
    document
      .getElementById("restoreFile")
      .addEventListener("change", function(event) {
        const file = event.target.files[0];
        restoreReadings(file);
        event.target.value = "";
      });

    displayReadings();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker
          .register("./service-worker.js")
          .catch(function(error) {
            console.log(
              "Service worker registration failed:",
              error
            );
          });
      });
    }
